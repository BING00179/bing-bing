<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께 읽는 성경</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2620; --muted: #7a7065;
    --line: #e7e0d6; --accent: #6b4f2a; --accent-ink: #ffffff;
    --done: #2f7d4f; --done-bg: #e8f4ec; --miss: #c0392b; --miss-bg: #fdecea;
    --bar: #efe8dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17; --card: #26231f; --ink: #f1ebe2; --muted: #a99f92;
      --line: #3a352f; --accent: #d8b27a; --accent-ink: #1c1a17;
      --done: #6fcf97; --done-bg: #1f3328; --miss: #ff7b6e; --miss-bg: #3a2220;
      --bar: #3a352f;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  header .who { font-size: 15px; color: var(--muted); }
  header .who button { font-size: 15px; }
  .linkbtn { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 4px; cursor: pointer; font: inherit; }
  nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
  nav button {
    font: inherit; font-size: 17px; padding: 10px 4px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .date { color: var(--muted); font-size: 17px; }
  .portion { font-size: 30px; font-weight: 800; margin: 6px 0 16px; line-height: 1.3; word-break: keep-all; }
  .big {
    width: 100%; font: inherit; font-size: 22px; font-weight: 700; padding: 18px; border-radius: 14px;
    border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .big.done { background: var(--done-bg); color: var(--done); border: 2px solid var(--done); }
  .hint { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; }
  .bar { height: 10px; background: var(--bar); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--done); border-radius: 99px; }
  .small { font-size: 15px; color: var(--muted); word-break: keep-all; }
  .miss { color: var(--miss); font-weight: 700; }
  .missbtn { color: var(--miss); font-weight: 700; background: var(--miss-bg); border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .row { padding: 14px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 0; }
  .row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .row .name { font-weight: 700; font-size: 19px; }
  .day { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit;
    padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    margin-bottom: 8px; cursor: pointer; }
  .day .d { min-width: 92px; color: var(--muted); font-size: 15px; }
  .day .p { flex: 1; word-break: keep-all; }
  .day .s { font-size: 15px; white-space: nowrap; }
  .day.done .s { color: var(--done); font-weight: 700; }
  .day.missed { border-color: var(--miss); background: var(--miss-bg); }
  .day.missed .s { color: var(--miss); font-weight: 700; }
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 12px 0 18px; }
  .names button { font: inherit; font-size: 19px; padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  input[type=text] { width: 100%; font: inherit; font-size: 20px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 8px 0 10px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 488px; margin: 0 auto; background: var(--ink); color: var(--bg);
    padding: 12px 16px; border-radius: 12px; font-size: 16px; display: none; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  button:disabled { opacity: .6; cursor: wait; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>함께 읽는 성경</h1>
    <span class="who" id="who"></span>
  </header>
  <div id="main"><div class="loading">불러오는 중…</div></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// 성경통독 — 순수 로직. 화면·앱스 스크립트 서버·시험이 같은 파일을 씁니다.
// 날짜는 전부 'YYYY-MM-DD' 문자열(한국 날짜)로 다루고, 계산은 UTC 로 해서
// 휴대폰 시간대와 상관없이 같은 답이 나오게 합니다.
var Core = (function () {
  // [이름, 장 수] — 개역개정 66권. 합계 1,189장 (시험이 지킴)
  var BOOKS = [
    ['창세기', 50], ['출애굽기', 40], ['레위기', 27], ['민수기', 36], ['신명기', 34],
    ['여호수아', 24], ['사사기', 21], ['룻기', 4], ['사무엘상', 31], ['사무엘하', 24],
    ['열왕기상', 22], ['열왕기하', 25], ['역대상', 29], ['역대하', 36], ['에스라', 10],
    ['느헤미야', 13], ['에스더', 10], ['욥기', 42], ['시편', 150], ['잠언', 31],
    ['전도서', 12], ['아가', 8], ['이사야', 66], ['예레미야', 52], ['예레미야애가', 5],
    ['에스겔', 48], ['다니엘', 12], ['호세아', 14], ['요엘', 3], ['아모스', 9],
    ['오바댜', 1], ['요나', 4], ['미가', 7], ['나훔', 3], ['하박국', 3],
    ['스바냐', 3], ['학개', 2], ['스가랴', 14], ['말라기', 4],
    ['마태복음', 28], ['마가복음', 16], ['누가복음', 24], ['요한복음', 21], ['사도행전', 28],
    ['로마서', 16], ['고린도전서', 16], ['고린도후서', 13], ['갈라디아서', 6], ['에베소서', 6],
    ['빌립보서', 4], ['골로새서', 4], ['데살로니가전서', 5], ['데살로니가후서', 3], ['디모데전서', 6],
    ['디모데후서', 4], ['디도서', 3], ['빌레몬서', 1], ['히브리서', 13], ['야고보서', 5],
    ['베드로전서', 5], ['베드로후서', 3], ['요한1서', 5], ['요한2서', 1], ['요한3서', 1],
    ['유다서', 1], ['요한계시록', 22]
  ];
  var START = '2027-01-01';
  var SUNDAY_CHAPTERS = 5;
  var OTHER_CHAPTERS = 3; // 평일·토요일·공휴일

  // 전체 장 번호(0~1188) → [권 번호, 장]
  var CHAPTERS = [];
  BOOKS.forEach(function (b, bi) {
    for (var c = 1; c <= b[1]; c++) CHAPTERS.push([bi, c]);
  });
  var TOTAL = CHAPTERS.length;

  function toUTC(d) { return Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)); }
  function fromUTC(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function addDays(d, n) { return fromUTC(toUTC(d) + n * 86400000); }
  function weekday(d) { return new Date(toUTC(d)).getUTCDay(); } // 0 = 주일

  // 날마다 [시작 장, 끝 장] 을 미리 계산
  var PLAN = {};
  var END = START;
  (function () {
    var at = 0, d = START;
    while (at < TOTAL) {
      var n = weekday(d) === 0 ? SUNDAY_CHAPTERS : OTHER_CHAPTERS;
      var to = Math.min(at + n, TOTAL) - 1;
      PLAN[d] = { from: at, to: to };
      END = d;
      at = to + 1;
      d = addDays(d, 1);
    }
  })();
  var DAY_COUNT = Object.keys(PLAN).length;

  function portionFor(d) { return PLAN[d] || null; }

  function chapterIndex(book, ch) {
    for (var i = 0; i < TOTAL; i++) {
      if (BOOKS[CHAPTERS[i][0]][0] === book && CHAPTERS[i][1] === ch) return i;
    }
    return -1;
  }

  function portionLabel(p) {
    if (!p) return '';
    var a = CHAPTERS[p.from], b = CHAPTERS[p.to];
    var an = BOOKS[a[0]][0], bn = BOOKS[b[0]][0];
    if (a[0] !== b[0]) return an + ' ' + a[1] + '장 ~ ' + bn + ' ' + b[1] + '장';
    if (a[1] === b[1]) return an + ' ' + a[1] + '장';
    return an + ' ' + a[1] + '~' + b[1] + '장';
  }

  // records: [[이름, 날짜, '완료'|'취소'], ...] 기록 순서대로. 마지막 줄이 그날 상태.
  function doneSet(records, name) {
    var last = {};
    records.forEach(function (r) {
      if (r[0] === name) last[r[1]] = r[2];
    });
    var s = new Set();
    Object.keys(last).forEach(function (d) {
      if (last[d] === '완료' && PLAN[d]) s.add(d);
    });
    return s;
  }

  function progress(dates) {
    var ch = 0;
    dates.forEach(function (d) {
      var p = PLAN[d];
      if (p) ch += p.to - p.from + 1;
    });
    return { chapters: ch, percent: Math.floor(ch * 1000 / TOTAL) / 10 };
  }

  // 시작일부터 어제까지(끝날을 넘지 않게) 중 완료 안 한 날 수. 오늘은 세지 않음.
  function missedDays(dates, today) {
    var last = addDays(today, -1);
    if (last > END) last = END;
    var n = 0;
    for (var d = START; d <= last; d = addDays(d, 1)) {
      if (!dates.has(d)) n++;
    }
    return n;
  }

  function lastReadLabel(dates) {
    var latest = '';
    dates.forEach(function (d) { if (d > latest) latest = d; });
    if (!latest) return '';
    var c = CHAPTERS[PLAN[latest].to];
    return BOOKS[c[0]][0] + ' ' + c[1] + '장까지';
  }

  function validName(s) {
    if (typeof s !== 'string') return null;
    var t = s.replace(/\s+/g, ' ').trim();
    if (t.length < 1 || t.length > 20) return null;
    return t;
  }

  // ── 달력 알림 파일(.ics) ─────────────────────────────────────
  // 날마다 한국 시각 06:00~06:15 일정 + 시작 시각에 울리는 알림.
  // 시간은 UTC 로 적어 시간대 정보 없이도 어느 휴대폰에서나 같은 순간에 울림.
  var ALARM_HOUR_KST = 6;

  function icsEscape(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }
  function utf8Len(ch) {
    var c = ch.codePointAt(0);
    return c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
  }
  // 한 줄 75바이트 넘으면 접기 (글자 중간에서 자르지 않음)
  function fold(line) {
    var out = '', len = 0;
    Array.from(line).forEach(function (ch) {
      var n = utf8Len(ch);
      if (len + n > 75) { out += '\r\n '; len = 1; }
      out += ch; len += n;
    });
    return out;
  }
  function stampUTC(d, hour, minute) {
    var ms = toUTC(d) + ((hour - 9) * 60 + minute) * 60000; // KST = UTC+9
    return new Date(ms).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  }

  function icsFor(appUrl) {
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//bible-reading//KO', 'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEscape('함께 읽는 성경')];
    Object.keys(PLAN).sort().forEach(function (d) {
      var label = portionLabel(PLAN[d]);
      var desc = '오늘 읽을 곳: ' + label + '\n읽고 나서 [읽기 완료] 누르기: ' + appUrl;
      L.push('BEGIN:VEVENT',
        'UID:bible-' + d.replace(/-/g, '') + '@bible-reading',
        'DTSTAMP:' + stampUTC(START, 0, 0),
        'DTSTART:' + stampUTC(d, ALARM_HOUR_KST, 0),
        'DTEND:' + stampUTC(d, ALARM_HOUR_KST, 15),
        'SUMMARY:' + icsEscape('📖 ' + label),
        'DESCRIPTION:' + icsEscape(desc),
        'URL:' + appUrl,
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT0M',
        'DESCRIPTION:' + icsEscape('📖 ' + label),
        'END:VALARM', 'END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.map(fold).join('\r\n') + '\r\n';
  }

  return {
    icsFor: icsFor, icsEscape: icsEscape,
    BOOKS: BOOKS, TOTAL: TOTAL, START: START, END: END, DAY_COUNT: DAY_COUNT,
    addDays: addDays, weekday: weekday, portionFor: portionFor, chapterIndex: chapterIndex,
    portionLabel: portionLabel, doneSet: doneSet, progress: progress,
    missedDays: missedDays, lastReadLabel: lastReadLabel, validName: validName
  };
})();



var google = (function () {
  var K = 'bible.preview.db';
  function db() { try { return JSON.parse(localStorage.getItem(K)) || { members: [], records: [] }; } catch (e) { return { members: [], records: [] }; } }
  function put(d) { try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) {} }
  function today() {
    var q = new URLSearchParams(location.search).get('today');
    return q || new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  }
  function state(d) { return { today: today(), members: d.members.slice(), records: d.records.slice(), appUrl: icsUrl() }; }
  // 미리보기에는 서버가 없으므로 달력 파일을 이 자리에서 만들어 내려받게 함
  var icsBlobUrl = null;
  function icsUrl() {
    if (!icsBlobUrl) icsBlobUrl = URL.createObjectURL(new Blob([Core.icsFor(location.href.split('?')[0])], { type: 'text/calendar' }));
    return icsBlobUrl + '#';
  }
  var api = {
    getState: function () { return state(db()); },
    register: function (name) {
      var n = Core.validName(name);
      if (!n) throw new Error('이름은 1~20자로 적어 주세요.');
      var d = db(); if (d.members.indexOf(n) < 0) d.members.push(n); put(d);
      var s = state(d); s.name = n; return s;
    },
    mark: function (name, date, done) {
      if (!Core.portionFor(date)) throw new Error('읽기표에 없는 날짜입니다.');
      if (date > today()) throw new Error('아직 오지 않은 날은 체크할 수 없어요.');
      var d = db();
      if (d.members.indexOf(name) < 0) throw new Error('등록되지 않은 이름입니다.');
      d.records.push([name, date, done ? '완료' : '취소']); put(d); return state(d);
    }
  };
  function runner(ok, fail) {
    var r = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    Object.keys(api).forEach(function (k) {
      r[k] = function () {
        var a = arguments;
        setTimeout(function () { try { ok(api[k].apply(null, a)); } catch (e) { fail(e); } }, 150);
      };
    });
    return r;
  }
  return { script: { run: runner(function () {}, function () {}) } };
})();

</script>
<script>
(function () {
  var state = null;       // { today, members, records }
  var me = null;          // 이 휴대폰의 이름
  var tab = 'today';
  var busy = false;
  var KEY = 'bible.name';

  function load() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(n) { try { n ? localStorage.setItem(KEY, n) : localStorage.removeItem(KEY); } catch (e) {} }

  // google.script.run 을 약속(Promise)으로
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, fail) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
      r[fn].apply(r, args);
    });
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function dateLabel(d, withYear) {
    var s = (withYear ? d.slice(0, 4) + '년 ' : '') + (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일';
    var w = Core.weekday(d);
    return s + ' (' + (w === 0 ? '주일' : WD[w]) + ')';
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3500);
  }
  function errMsg(e) { return (e && e.message) ? e.message : '연결이 원활하지 않아요. 잠시 뒤 다시 눌러 주세요.'; }

  function mine(name) {
    var done = Core.doneSet(state.records, name);
    return { done: done, prog: Core.progress(done), missed: Core.missedDays(done, state.today) };
  }
  function progressHtml(p) {
    return '<div class="bar"><i style="width:' + p.percent + '%"></i></div>' +
      '<div class="small">' + p.chapters.toLocaleString() + '장 / ' + Core.TOTAL.toLocaleString() + '장 (' + p.percent + '%)</div>';
  }

  function render() {
    var who = document.getElementById('who');
    var main = document.getElementById('main');
    if (!me) {
      who.innerHTML = '';
      main.innerHTML = pickerHtml();
      return;
    }
    who.innerHTML = esc(me) + ' 님 · <button class="linkbtn" data-act="switch">다른 이름</button>';
    var tabs = [['today', '오늘'], ['all', '함께 읽기'], ['past', '지난 날']];
    main.innerHTML = '<nav role="tablist">' + tabs.map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + '</button>';
    }).join('') + '</nav>' + (tab === 'today' ? todayHtml() : tab === 'all' ? allHtml() : pastHtml());
  }

  function pickerHtml() {
    var list = state.members.length
      ? '<div class="names">' + state.members.map(function (n) {
          return '<button data-act="pick" data-name="' + esc(n) + '">' + esc(n) + '</button>';
        }).join('') + '</div>'
      : '<p class="small">아직 등록한 분이 없어요. 첫 번째로 이름을 적어 주세요.</p>';
    return '<div class="card"><div class="portion" style="font-size:24px;margin-top:0">누구세요?</div>' +
      '<div class="small">내 이름을 눌러 주세요. 이 휴대폰에서는 다음부터 기억해요.</div>' + list +
      '<div style="font-weight:700">처음이에요</div>' +
      '<input type="text" id="newname" maxlength="20" placeholder="이름 (예: 김영희)" autocomplete="name">' +
      '<button class="big" data-act="register">이름 등록하기</button></div>';
  }

  function todayHtml() {
    var t = state.today, m = mine(me), p = Core.portionFor(t), h = '';
    if (t < Core.START) {
      h += '<div class="card"><div class="date">' + dateLabel(t, true) + '</div>' +
        '<div class="portion">' + dateLabel(Core.START, true) + '<br>' + Core.portionLabel(Core.portionFor(Core.START)) + '으로 시작해요</div>' +
        '<div class="small">평일·토요일·공휴일 3장, 주일 5장씩 읽어요. ' + dateLabel(Core.END, true) + '에 요한계시록까지 마칩니다.</div></div>';
    } else if (!p) {
      h += '<div class="card"><div class="date">' + dateLabel(t, true) + '</div><div class="portion">올해 읽기표를 모두 마쳤어요</div></div>';
    } else {
      var done = m.done.has(t);
      h += '<div class="card"><div class="date">오늘 · ' + dateLabel(t) + '</div>' +
        '<div class="portion">' + Core.portionLabel(p) + '</div>' +
        '<button class="big' + (done ? ' done' : '') + '" data-act="mark" data-date="' + t + '" data-done="' + (done ? 0 : 1) + '">' +
        (done ? '읽었어요 ✅' : '읽기 완료') + '</button>' +
        (done ? '<div class="hint">잘못 눌렀으면 한 번 더 누르면 취소돼요</div>' : '') + '</div>';
    }
    h += alarmHtml();
    h += '<div class="card"><div style="font-weight:700">내 진도</div>' + progressHtml(m.prog) +
      (m.missed > 0 ? '<button class="missbtn" data-tab="past">밀린 날 ' + m.missed + '일 ›</button>' : '') + '</div>';
    return h;
  }

  // 매일 아침 6시 달력 알림. 한 번 넣으면 되므로 넣었다고 누르면 접어 둠.
  function alarmHtml() {
    var gotIt = false;
    try { gotIt = localStorage.getItem('bible.alarm') === '1'; } catch (e) {}
    if (gotIt) return '<div class="small" style="text-align:center;margin:-4px 0 12px">📅 아침 6시 알림 · <button class="linkbtn" data-act="alarm-show">다시 받기</button></div>';
    var href = state.appUrl ? esc(state.appUrl + '?cal=1') : '#';
    return '<div class="card"><div style="font-weight:700">📅 매일 아침 6시에 알림 받기</div>' +
      '<div class="small" style="margin:4px 0 12px">아래를 누르면 362일치 읽을 곳이 내 달력에 들어가고, 매일 아침 6시에 알림이 와요. 알림을 누르면 이 앱이 열려요.<br>' +
      '카톡 안에서 안 되면 오른쪽 위 ⋮ → <b>다른 브라우저로 열기</b> 뒤에 눌러 주세요.</div>' +
      '<a class="big" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="' + href + '" data-act="alarm-get">달력에 넣기</a>' +
      '<div class="hint"><button class="linkbtn" data-act="alarm-done">넣었어요 (이 칸 접기)</button></div></div>';
  }

  function allHtml() {
    var t = state.today;
    if (!state.members.length) return '<div class="card small">아직 등록한 분이 없어요.</div>';
    return '<div class="card">' + (Core.portionFor(t) ? '<div class="small" style="margin-bottom:10px">오늘 ' + Core.portionLabel(Core.portionFor(t)) + '</div>' : '') +
      state.members.map(function (n) {
        var m = mine(n), last = Core.lastReadLabel(m.done);
        return '<div class="row"><div class="top"><span class="name">' + esc(n) + (m.done.has(t) ? ' ✅' : '') + '</span>' +
          (m.missed > 0 ? '<span class="miss">밀린 ' + m.missed + '일</span>' : '') + '</div>' +
          '<div class="small">' + (last ? esc(last) : '아직 시작 전') + '</div>' + progressHtml(m.prog) + '</div>';
      }).join('') + '</div>';
  }

  function pastHtml() {
    var t = state.today;
    if (t < Core.START) return '<div class="card small">' + dateLabel(Core.START, true) + '부터 시작해요.</div>';
    var m = mine(me), last = t > Core.END ? Core.END : t, h = '';
    h += '<p class="small">날짜를 누르면 읽음 / 안 읽음이 바뀌어요. 몰아서 읽은 날도 체크해 주세요.</p>';
    for (var d = last; d >= Core.START; d = Core.addDays(d, -1)) {
      var done = m.done.has(d), missed = !done && d < t;
      h += '<button class="day' + (done ? ' done' : missed ? ' missed' : '') + '" data-act="mark" data-date="' + d + '" data-done="' + (done ? 0 : 1) + '">' +
        '<span class="d">' + dateLabel(d) + '</span><span class="p">' + Core.portionLabel(Core.portionFor(d)) + '</span>' +
        '<span class="s">' + (done ? '✅ 읽음' : missed ? '안 읽음' : '오늘') + '</span></button>';
    }
    return h;
  }

  function run(promise, after) {
    if (busy) return;
    busy = true;
    document.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    promise.then(function (s) { state = s; if (after) after(s); })
      .catch(function (e) { toast(errMsg(e)); })
      .then(function () { busy = false; render(); });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || busy) return;
    if (b.dataset.tab) { tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
    var act = b.dataset.act;
    if (act === 'alarm-done' || act === 'alarm-show') {
      try { act === 'alarm-done' ? localStorage.setItem('bible.alarm', '1') : localStorage.removeItem('bible.alarm'); } catch (e2) {}
      render(); return;
    }
    if (act === 'switch') { me = null; save(null); render(); }
    else if (act === 'pick') { me = b.dataset.name; save(me); tab = 'today'; render(); }
    else if (act === 'register') {
      var n = Core.validName(document.getElementById('newname').value);
      if (!n) { toast('이름을 1~20자로 적어 주세요.'); return; }
      run(call('register', n), function (s) { me = s.name; save(me); tab = 'today'; });
    }
    else if (act === 'mark') {
      run(call('mark', me, b.dataset.date, b.dataset.done === '1'), function () {
        if (b.dataset.done === '1') toast('읽기 완료! ' + dateLabel(b.dataset.date));
      });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'newname') document.querySelector('[data-act=register]').click();
  });

  function start() {
    call('getState').then(function (s) {
      state = s;
      var saved = load();
      me = saved && s.members.indexOf(saved) >= 0 ? saved : null;
      render();
    }).catch(function (e) {
      document.getElementById('main').innerHTML = '<div class="card">' + esc(errMsg(e)) +
        '<br><button class="big" style="margin-top:12px" onclick="location.reload()">다시 열기</button></div>';
    });
  }
  start();
})();
</script>
</body>
</html>
