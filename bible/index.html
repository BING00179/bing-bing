<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께 읽는 성경</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b4f2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성경통독">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2620; --muted: #7a7065;
    --line: #e7e0d6; --accent: #6b4f2a; --accent-ink: #ffffff;
    --done: #2f7d4f; --done-bg: #e8f4ec; --miss: #c0392b; --miss-bg: #fdecea;
    --bar: #efe8dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17; --card: #26231f; --ink: #f1ebe2; --muted: #a99f92;
      --line: #3a352f; --accent: #d8b27a; --accent-ink: #1c1a17;
      --done: #6fcf97; --done-bg: #1f3328; --miss: #ff7b6e; --miss-bg: #3a2220;
      --bar: #3a352f;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  header .who { font-size: 15px; color: var(--muted); }
  header .who button { font-size: 15px; }
  .linkbtn { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 4px; cursor: pointer; font: inherit; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
  nav button {
    font: inherit; font-size: 16px; padding: 10px 2px; border-radius: 12px; white-space: nowrap; letter-spacing: -0.02em;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .date { color: var(--muted); font-size: 17px; }
  .portion { font-size: 30px; font-weight: 800; margin: 6px 0 16px; line-height: 1.3; word-break: keep-all; }
  .big {
    width: 100%; font: inherit; font-size: 22px; font-weight: 700; padding: 18px; border-radius: 14px;
    border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .big.done { background: var(--done-bg); color: var(--done); border: 2px solid var(--done); }
  .hint { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; }
  .bar { height: 10px; background: var(--bar); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--done); border-radius: 99px; }
  .small { font-size: 15px; color: var(--muted); word-break: keep-all; }
  .miss { color: var(--miss); font-weight: 700; }
  .missbtn { color: var(--miss); font-weight: 700; background: var(--miss-bg); border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .row { padding: 14px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 0; }
  .row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .row .name { font-weight: 700; font-size: 19px; }
  .day { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit;
    padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    margin-bottom: 8px; cursor: pointer; }
  .day .d { min-width: 92px; color: var(--muted); font-size: 15px; }
  .day .p { flex: 1; word-break: keep-all; }
  .day .s { font-size: 15px; white-space: nowrap; }
  .day.done .s { color: var(--done); font-weight: 700; }
  .day.missed { border-color: var(--miss); background: var(--miss-bg); }
  .day.missed .s { color: var(--miss); font-weight: 700; }
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 12px 0 18px; }
  .names button { font: inherit; font-size: 19px; padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  input[type=text] { width: 100%; font: inherit; font-size: 20px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 8px 0 10px; }
  .readbtn { width: 100%; font: inherit; font-size: 20px; font-weight: 700; padding: 14px; border-radius: 14px; margin-bottom: 10px;
    background: var(--card); color: var(--accent); border: 2px solid var(--accent); cursor: pointer; }
  .reader .bar2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .reader .sizes button { font: inherit; font-size: 16px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .reader h2 { font-size: 1.15em; margin: 22px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .reader h2 a { font-size: 14px; font-weight: 400; color: var(--accent); }
  .reader .text { line-height: 1.85; word-break: keep-all; }
  .reader .text p { margin: 0 0 6px; }
  .reader .text sup { color: var(--muted); font-size: .65em; margin-right: 4px; vertical-align: .35em; }
  .reader .src { font-size: 13px; color: var(--muted); margin: 18px 0 14px; }
  .portionlink { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .ttsbar { display: flex; gap: 8px; align-items: center; margin: 6px -16px 4px; padding: 6px 16px; position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .ttsplay { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); flex: none; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .ttsplay svg { margin-left: 2px; }
  .ttsplay.on svg { margin-left: 0; }
  .ttslabel { font-size: 14px; color: var(--muted); min-width: 52px; }
  .seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); }
  .seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--muted); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
  .seg button.sel { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .reader .text p.speaking, .reader h2.speaking { background: var(--done-bg); border-radius: 8px; box-shadow: 0 0 0 4px var(--done-bg); }
  .copybtn { width: 100%; font: inherit; font-size: 18px; font-weight: 700; padding: 12px; border-radius: 14px; margin-top: 8px;
    background: var(--card); color: var(--accent); border: 2px solid var(--accent); cursor: pointer; }
  .copybtn.done { background: var(--done-bg); color: var(--done); border-color: var(--done); }
  .dayrow .open.copied { background: var(--done-bg); border-color: var(--done); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 18px; font-weight: 700; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
  .chip.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .seg.segwide { display: flex; margin: 0 0 12px; }
  .seg.segwide button { flex: 1; font-size: 16px; padding: 8px; }
  .demobar { background: #fff3cd; color: #6b4f00; border: 1px solid #f0d58a; border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 10px; text-align: center; }
  .reader .text p { cursor: pointer; border-radius: 6px; }
  .reader .text p.hl1 { background: #c7d2fe88; } .reader .text p.hl2 { background: #f5c2e788; } .reader .text p.hl3 { background: #fdba7488; }
  .reader .text p.hl4 { background: #fde68a99; } .reader .text p.hl5 { background: #a5f3fc88; } .reader .text p.hl6 { background: #bbf7d099; }
  .reader .text p.sel { background: var(--bar); box-shadow: 0 0 0 4px var(--bar); }
  .reader .text p.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--done-bg); } }
  .reader .mk svg { width: .8em; height: .8em; vertical-align: -.05em; color: var(--accent); }
  .reader .mk.bm svg { fill: var(--accent); }
  /* 묵상 표시: 글자색과 다른 색 동그라미 안에 연필 — 한눈에 보이게 */
  .reader .text p.hasmemo { border-left: 4px solid #d8b27a; padding-left: 10px; border-radius: 0 6px 6px 0; }
  .reader .mk.memo { display: inline-block; font-size: .6em; font-weight: 700; color: #6b4f2a; background: #efe4d2;
    border-radius: 10px; padding: 1px 8px; vertical-align: .2em; line-height: 1.6; }
  @media (prefers-color-scheme: dark) { .reader .mk.memo { background: #3a332a; color: #e7cfa6; } }
  body.hasbar .reader { padding-bottom: 240px; }
  #versebar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 16px rgba(0,0,0,.12); padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  #versebar .vb-top { display: flex; justify-content: space-between; align-items: center; max-width: 520px; margin: 0 auto 6px; }
  #versebar .vb-row { display: flex; gap: 6px; max-width: 520px; margin: 0 auto 8px; }
  #versebar .vb-btn { flex: 1; font: inherit; font-size: 14px; border: 0; background: none; color: var(--ink); padding: 6px 2px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #versebar .vb-btn svg { color: var(--muted); }
  #versebar .vb-btn.on svg { color: var(--accent); }
  #versebar .vb-btn.on { color: var(--accent); font-weight: 700; background: var(--bg); }
  #versebar .colors { justify-content: space-between; }
  #versebar .dot { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; font-size: 18px; background: var(--card); color: var(--muted); }
  #versebar .memopast { max-width: 520px; margin: 0 auto 6px; background: var(--bg); border-radius: 10px; padding: 8px 10px;
    font-size: 15px; white-space: pre-wrap; max-height: 30vh; overflow: auto; }
  #versebar .memopast b { display: flex !important; justify-content: space-between; align-items: center; }
  #versebar .memopast b .linkbtn { font-size: 13px; font-weight: 400; color: var(--muted); }
  #versebar .memopast b, #versebar .memoyr { display: block; font-size: 13px; color: var(--accent); margin-bottom: 2px; }
  #versebar .memoyr { max-width: 520px; margin: 0 auto 2px; font-weight: 700; }
  #versebar textarea { display: block; width: 100%; max-width: 520px; margin: 0 auto 8px; font: inherit; font-size: 17px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .notelink { display: block; width: 100%; text-align: left; font: inherit; font-size: 16px; padding: 10px 4px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; }
  .dayrow { display: flex; gap: 6px; align-items: stretch; margin-bottom: 8px; }
  .dayrow .day { margin-bottom: 0; }
  .dayrow .open { font: inherit; font-size: 20px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  .hoursel { font: inherit; font-size: 18px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-left: 6px; }
  .switch { display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; font-size: 19px; font-weight: 700; padding: 12px 14px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .switch .knob { position: relative; width: 52px; height: 30px; border-radius: 99px; background: var(--bar); flex: none; transition: background .15s; }
  .switch .knob::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
  .switch.on .knob { background: var(--done); }
  .switch.on .knob::after { left: 25px; }
  ol.steps { margin: 6px 0 14px; padding-left: 22px; line-height: 1.7; }
  ol.steps li { margin-bottom: 6px; }
  .key { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: .9em; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 488px; margin: 0 auto; background: var(--ink); color: var(--bg);
    padding: 12px 16px; border-radius: 12px; font-size: 16px; display: none; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  button:disabled { opacity: .6; cursor: wait; }
  .big[disabled], .copybtn[disabled] { opacity: .4; cursor: not-allowed; }
  .grp { font-size: .6em; font-weight: 600; color: #6b7280; margin-left: 4px; }
  .grp:empty { display: none; }
  .admrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .admbtn { width: auto !important; margin: 0 !important; padding: 6px 14px !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>함께 읽는 성경 <small id="grp" class="grp"></small></h1>
    <span class="who" id="who"></span>
  </header>
  <div id="main"><div class="loading">불러오는 중…</div></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="core.js"></script>
<script src="api.js"></script>
<script>
(function () {
  var state = null;       // { today, members, records }
  var me = null;          // 이 휴대폰의 이름
  var tab = 'today';
  var busy = false;
  var KEY = 'bible.name' + (Api.group ? '.' + Api.group : ''); // 모임마다 이름 따로

  function load() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(n) { try { n ? localStorage.setItem(KEY, n) : localStorage.removeItem(KEY); } catch (e) {} }

  var call = Api.call;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function dateLabel(d, withYear) {
    var s = (withYear ? d.slice(0, 4) + '년 ' : '') + (+d.slice(5, 7)) + '월 ' + (+d.slice(8, 10)) + '일';
    var w = Core.weekday(d);
    return s + ' (' + (w === 0 ? '주일' : WD[w]) + ')';
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3500);
  }
  function errMsg(e) { return (e && e.message) ? e.message : '연결이 원활하지 않아요. 잠시 뒤 다시 눌러 주세요.'; }

  // ── 회차 ── 지금 회차의 읽기표(P)로 모든 것을 셈. 다음 회차가 열려 있으면 참여 안내.
  var P = Core.makePlan(Core.FIRST_START), TN = { cur: { n: 1, start: Core.FIRST_START }, next: null };
  function setState(s) {
    state = s;
    var terms = s.terms && s.terms.length ? s.terms : Core.termsFrom([]);
    TN = Core.termsNow(terms, s.today);
    P = Core.makePlan(TN.cur.start);
    if (s.groupName) document.getElementById('grp').textContent = s.groupName;
    // 알림 받는 곳(sw.js)도 지금 회차를 알게 저장
    try { if (window.caches) caches.open('bible-meta').then(function (c) { c.put('terms', new Response(JSON.stringify(terms))); }); } catch (e) {}
  }
  function openTerm() { return TN.next || TN.cur; }
  // ── 팀 ── 읽기 팀·필사 팀 (같은 날짜 같은 분량, 멤버만 다름). 회차마다 고름.
  // 화면 이름만 성경통독·성경필사 (시트·서버 값은 읽기·필사 그대로 — 예전 기록과 맞춤)
  function teamName(t) { return t === '필사' ? '성경필사' : '성경통독'; }
  function inTeam(team, term, name) {
    return Core.participants(term || TN.cur, state.members, state.joins || [], team).indexOf(name || me) >= 0;
  }
  function teamPicked() { try { return localStorage.getItem('bible.teamPick.' + (Api.group ? Api.group + '.' : '') + openTerm().n + '.' + me) === '1'; } catch (e) { return true; } }
  function teamChips(term) {
    return '<div class="chips">' + Core.TEAMS.map(function (team) {
      var on = inTeam(team, term);
      return '<button class="chip' + (on ? ' on' : '') + '" data-act="team-toggle" data-team="' + team + '">' + (on ? '✓ ' : '') + teamName(team) + '</button>';
    }).join('') + '</div>';
  }
  // 처음이거나 새 회차면 팀 고르기 (둘 다 골라도 됨)
  function joinHtml() {
    var t = openTerm();
    if (!t || teamPicked()) return '';
    var p = Core.makePlan(t.start);
    return '<div class="card"><div class="small">' + (TN.next ? '다음 회차 · ' : '') + t.n + '기 · ' + dateLabel(t.start, true) + ' ~ ' + dateLabel(p.END, true) + '</div>' +
      '<div class="portion" style="margin-top:0;font-size:24px">참여 팀</div>' +
      '<div class="small" style="margin-bottom:10px">하는 것을 모두 눌러 주세요. 나중에 ⚙ 설정에서 바꿀 수 있어요.</div>' +
      teamChips(t) + '<button class="big" style="margin-top:12px" data-act="team-ok">확인</button></div>';
  }

  // ── 필사 ── 분량·밀린 날 없이 '필사 완료' 누른 날 수만 셈. 필사 팀에게만 버튼.
  function copyBtn(d, cls) {
    if (!inTeam('필사')) return '';
    var did = P.doneSet(state.records, me, '필사').has(d);
    return '<button class="copybtn' + (did ? ' done' : '') + (cls ? ' ' + cls : '') + '" data-act="copy" data-date="' + d + '" data-done="' + (did ? 0 : 1) + '">' +
      (did ? '✍️ 필사 완료됨' : '✍️ 필사 완료') + '</button>';
  }

  function mine(name) {
    var done = P.doneSet(state.records, name);
    var copied = P.doneSet(state.records, name, '필사');
    return { done: done, prog: P.progress(done), missed: P.missedDays(done, state.today), copied: copied };
  }
  function progressHtml(p) {
    return '<div class="bar"><i style="width:' + p.percent + '%"></i></div>' +
      '<div class="small">' + p.chapters.toLocaleString() + '장 / ' + Core.TOTAL.toLocaleString() + '장 (' + p.percent + '%)</div>';
  }

  // ── 보던 자리 기억 ── 휴대폰이 내린 앱을 새로 띄워도 읽다 만 말씀·위치·들은 절로 돌아오게
  var VIEW = 'bible.view';
  function saveView() {
    try {
      localStorage.setItem(VIEW, JSON.stringify({ me: me, tab: tab, reading: reading, readFrom: readFrom,
        y: Math.round(window.scrollY), tts: Tts.where(), at: Date.now() }));
    } catch (e) {}
  }
  function loadView() {
    try {
      var v = JSON.parse(localStorage.getItem(VIEW));
      return v && v.me === me && Date.now() - v.at < 12 * 3600 * 1000 ? v : null; // 12시간 안이면
    } catch (e) { return null; }
  }
  window.addEventListener('pagehide', saveView);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveView(); });
  var scrollTimer = null;
  window.addEventListener('scroll', function () { clearTimeout(scrollTimer); scrollTimer = setTimeout(saveView, 400); }, { passive: true });

  function render() {
    var who = document.getElementById('who');
    var main = document.getElementById('main');
    if (Api.demo && !document.getElementById('demobar')) {
      var bar = document.createElement('div');
      bar.id = 'demobar'; bar.className = 'demobar';
      bar.textContent = '시연용 화면 · 2027년 1월 15일로 가정 · 예시 회원 · 실제 기록 아님';
      document.querySelector('.wrap').insertBefore(bar, document.querySelector('.wrap').firstChild);
    }
    if (!me) {
      who.innerHTML = '';
      main.innerHTML = pickerHtml();
      return;
    }
    who.innerHTML = esc(me) + ' 님 · <button class="linkbtn" data-act="switch">다른 이름</button>';
    // 브라우저로 열었으면 예전 기록과 상관없이 설치부터 (이번에 '설치 없이' 를 누른 때만 건너뜀).
    // 설치한 앱으로 열었으면 알림 설정이 끝날 때까지 알림 단계.
    if (!Install.standalone() ? !installSkipped() : !setupDone()) { main.innerHTML = setupHtml(); return; }
    var tabs = [['today', '오늘'], ['all', '함께 읽기'], ['past', '지난 날'], ['set', '⚙ 설정']];
    if (reading) { main.innerHTML = readerHtml(); return; }
    main.innerHTML = '<nav role="tablist">' + tabs.map(function (t) {
      return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + '</button>';
    }).join('') + '</nav>' + (tab === 'today' ? todayHtml() : tab === 'all' ? allHtml() : tab === 'set' ? settingsHtml() : pastHtml());
  }

  // ── 처음 한 번: 홈 화면 설치 → 알림 켜기 (원스톱) ──
  function setupDone() { try { return localStorage.getItem('bible.setup') === 'done' || !!alarmChoice(); } catch (e) { return true; } }
  function finishSetup() { try { localStorage.setItem('bible.setup', 'done'); } catch (e) {} tab = 'today'; render(); window.scrollTo(0, 0); }
  // '설치 없이' 는 이번에 열었을 때만 — 다음에 열면 설치부터 다시 (예전에 쓰던 localStorage 값은 보지 않음)
  function skipInstall() { try { sessionStorage.setItem('bible.installSkip2', '1'); } catch (e) {} }
  function installSkipped() { try { return sessionStorage.getItem('bible.installSkip2') === '1'; } catch (e) { return false; } }
  function stepHead(n, title) {
    return '<div class="small" style="margin-bottom:4px">' + n + ' / 2 단계</div><div class="portion" style="font-size:24px;margin-top:0">' + title + '</div>';
  }
  // 홈 화면 설치 안내 (처음 설정과 ⚙ 설정이 같이 씀)
  function installBlock() {
    var h = '';
    if (Install.canPrompt()) {
      h += '<div class="small" style="margin-bottom:12px">한 번 설치하면 앱처럼 아이콘을 눌러 바로 열려요.</div>' +
        '<button class="big" data-act="install">홈 화면에 설치하기</button>';
    } else if (Install.isIOS()) {
      h += '<ol class="steps"><li>화면 아래 가운데 <b>공유 버튼</b> <span class="key">□↑</span> 을 누르세요</li>' +
        '<li>목록을 올려 <b>홈 화면에 추가</b> 를 누르세요</li>' +
        '<li>오른쪽 위 <b>추가</b> 를 누르세요</li>' +
        '<li>홈 화면에 생긴 <b>성경통독</b> 아이콘으로 다시 열면 <b>알림 켜기</b> 가 이어져요</li></ol>' +
        '<div class="small">아이폰은 홈 화면 아이콘으로 연 앱에서만 알림을 받을 수 있어요. 이름은 한 번 더 골라 주세요.</div>';
    } else {
      h += '<ol class="steps"><li>오른쪽 위 <b>⋮</b> (또는 아래 <b>≡</b>) 메뉴를 누르세요</li>' +
        '<li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b> 를 누르세요</li>' +
        '<li><b>설치</b> / <b>추가</b> 를 누르세요</li></ol>' +
        '<button class="big" data-act="installed">설치 완료</button>';
    }
    return h;
  }

  function setupHtml() {
    var h = '<div class="card">';
    // 순서: 브라우저에서는 설치까지만 → 설치한 앱(홈 화면 아이콘)으로 열면 그 안에서 알림 켜기
    if (!Install.standalone() && !installSkipped() && Install.installed()) {
      h += stepHead(1, '✅ 설치 완료') +
        '<div style="font-size:20px;line-height:1.6;margin:8px 0 14px">이제 휴대폰 <b>홈 화면</b>에 생긴<br><b>📖 성경통독</b> 아이콘을 눌러 열어 주세요.</div>' +
        '<div class="small">그 앱 안에서 <b>2/2 알림 켜기</b> 가 이어져요. 이 브라우저 창은 닫으셔도 돼요.</div>' +
        '<button class="readbtn" style="margin-top:14px" data-act="not-installed">아직 설치 안 됐어요</button>' +
        '<div class="hint"><button class="linkbtn" data-act="install-skip">설치 없이 이대로 쓰기</button></div>';
    } else if (!Install.standalone() && !installSkipped()) {
      h += stepHead(1, '📲 홈 화면에 앱 설치');
      h += installBlock();
      h += '<div class="hint"><button class="linkbtn" data-act="install-skip">설치 없이 이대로 쓰기</button></div>';
    } else {
      h += stepHead(2, '🔔 매일 알림') + hourPicker();
      var push = Push.status();
      if (state.vapidKey && push === 'ok' && Push.permission() === 'denied') {
        h += deniedHtml();
      } else if (state.vapidKey && push === 'ok') {
        h += '<div class="small" style="margin-bottom:12px">고른 시간에 "📖 오늘 읽을 곳" 알림이 와요. 누르면 바로 이 앱이 열려요.</div>' +
          '<button class="big" data-act="setup-push">알림 켜기</button>' +
          '<div class="small" style="margin-top:8px">휴대폰이 "알림 허용?" 을 물으면 <b>허용</b> 을 눌러 주세요.</div>';
      } else if (push === 'ios-home') {
        h += '<div class="small" style="margin-bottom:12px">아이폰은 홈 화면 아이콘으로 연 앱에서만 앱 알림이 돼요. 대신 달력 알림을 쓰실 수 있어요.</div>';
      } else {
        h += '<div class="small" style="margin-bottom:12px">이 휴대폰에서는 앱 알림이 안 돼요. 대신 달력 알림을 쓰실 수 있어요.</div>';
      }
      h += calLink('📅 달력으로 받기') +
        '<div class="hint"><button class="linkbtn" data-act="setup-none">알림 없이 시작하기</button></div>';
    }
    return h + '</div>';
  }

  function pickerHtml() {
    var list = state.members.length
      ? '<div class="names">' + state.members.map(function (n) {
          return '<button data-act="pick" data-name="' + esc(n) + '">' + esc(n) + '</button>';
        }).join('') + '</div>'
      : '<p class="small">아직 등록한 분이 없어요. 첫 번째로 이름을 적어 주세요.</p>';
    return '<div class="card"><div class="portion" style="font-size:24px;margin-top:0">이름 선택</div>' +
      '<div class="small">내 이름을 눌러 주세요. 이 휴대폰에서는 다음부터 기억해요.</div>' + list +
      '<div style="font-weight:700">새로 등록</div>' +
      '<input type="text" id="newname" maxlength="20" placeholder="이름 (예: 김영희)" autocomplete="name">' +
      '<button class="big" data-act="register">이름 등록하기</button></div>';
  }

  function todayHtml() {
    var t = state.today, m = mine(me), p = P.portionFor(t), h = joinHtml();
    if (t < P.START) {
      h += '<div class="card"><div class="date">' + dateLabel(t, true) + '</div>' +
        '<div class="small" style="margin-top:6px">시작</div><div class="portion" style="margin-top:0">' + dateLabel(P.START, true) + '<br>' +
        '<button class="portionlink" data-act="read" data-date="' + P.START + '">' + Core.portionLabel(P.portionFor(P.START)) + '</button></div>' +
        '<button class="readbtn" data-act="read" data-date="' + P.START + '">📖 말씀 미리 보기</button>' +
        // 시작 전에는 내 팀 버튼을 흐리게 미리 보여 줌 (누를 수 없음)
        (inTeam('읽기') ? '<button class="big" disabled>읽기 완료</button>' : '') +
        (inTeam('필사') ? '<button class="copybtn" disabled>✍️ 필사 완료</button>' : '') +
        (inTeam('읽기') || inTeam('필사') ? '<div class="hint">' + dateLabel(P.START) + '부터 누를 수 있어요</div>' : '') +
        '<div class="small" style="margin-top:10px">평일·토요일·공휴일 3장, 주일 5장씩 읽어요. ' + dateLabel(P.END, true) + '에 요한계시록까지 마칩니다.</div></div>';
    } else if (!p) {
      h += '<div class="card"><div class="date">' + dateLabel(t, true) + '</div><div class="portion">' + TN.cur.n + '기 통독 완료</div>' + (TN.next ? '<div class="small">' + TN.next.n + '기 시작 · ' + dateLabel(TN.next.start, true) + '</div>' : '<div class="small">다음 회차는 리더가 정하면 열려요.</div>') + '</div>';
    } else {
      var done = m.done.has(t), rd = inTeam('읽기');
      h += '<div class="card"><div class="date">오늘 · ' + dateLabel(t) + '</div>' +
        '<div class="portion"><button class="portionlink" data-act="read" data-date="' + t + '">' + Core.portionLabel(p) + '</button></div>' +
        '<button class="readbtn" data-act="read" data-date="' + t + '">📖 말씀 읽기</button>' +
        (rd ? '<button class="big' + (done ? ' done' : '') + '" data-act="mark" data-date="' + t + '" data-done="' + (done ? 0 : 1) + '">' +
        (done ? '✅ 읽기 완료됨' : '읽기 완료') + '</button>' : '') + copyBtn(t) +
        (!rd && !inTeam('필사') ? '<div class="small" style="margin-top:8px">참여 팀 없음 · <button class="linkbtn" data-tab="set">설정</button></div>' : '') +
        (rd && done ? '<div class="hint">잘못 눌렀으면 한 번 더 누르면 취소돼요</div>' : '') + '</div>';
    }
    var ac = alarmChoice();
    h += '<div class="small" style="text-align:center;margin:-4px 0 12px">' +
      (ac === 'push' ? '🔔 매일 ' + Core.hourLabel(myHour()) + ' 알림' : ac === 'cal' ? '📅 달력 알림 · 매일 ' + Core.hourLabel(myHour()) : '🔕 알림 꺼짐') +
      ' · <button class="linkbtn" data-tab="set">설정</button></div>';
    if (inTeam('읽기')) h += '<div class="card"><div style="font-weight:700">읽기 진도</div>' + progressHtml(m.prog) +
      (m.missed > 0 ? '<button class="missbtn" data-tab="past">밀린 날 ' + m.missed + '일 ›</button>' : '') + '</div>';
    if (inTeam('필사')) h += '<div class="card"><div style="font-weight:700">필사</div><div class="small">✍️ ' + TN.cur.n + '기 필사 ' + m.copied.size + '회</div></div>';
    return h;
  }

  // 아침 알림 — 📅 달력 / 🔔 앱 알림 / 필요 없음 중 고르기. 고른 것은 이 휴대폰에 기억.
  function alarmChoice() { try { return localStorage.getItem('bible.alarm') || ''; } catch (e) { return ''; } }
  function setAlarm(v) { try { v ? localStorage.setItem('bible.alarm', v) : localStorage.removeItem('bible.alarm'); } catch (e) {} }
  // 알림 시각 — 각자 고름 (5시~22시 정시, 처음엔 6시). 이 휴대폰에 기억.
  function myHour() { try { return Core.alarmHour(localStorage.getItem('bible.alarmHour')) || Core.DEFAULT_ALARM_HOUR; } catch (e) { return Core.DEFAULT_ALARM_HOUR; } }
  function setHour(h) { try { localStorage.setItem('bible.alarmHour', String(h)); } catch (e) {} }
  function hourPicker() {
    return '<label class="small" style="display:block;margin-bottom:12px">알림 시간 ' +
      '<select id="alarmHour" class="hoursel">' + Core.ALARM_HOURS.map(function (h) {
        return '<option value="' + h + '"' + (h === myHour() ? ' selected' : '') + '>' + Core.hourLabel(h) + '</option>';
      }).join('') + '</select></label>';
  }
  function calLink(label) {
    return '<a class="big" style="display:block;text-align:center;text-decoration:none;margin-top:10px;background:var(--card);color:var(--accent);border:2px solid var(--accent)"' +
      ' target="_blank" rel="noopener" href="' + esc(Api.calendarUrl(myHour())) + '" data-act="cal-get">' + label + '</a>';
  }

  // 알림이 막혀 있을 때 — 웹 앱은 설정 화면을 직접 열 수 없어서, 그 브라우저에 맞는 순서를 보여 주고
  // 설정하고 돌아오면(화면이 다시 보이면) 저절로 다시 확인해 알림을 켬.
  var pushWanted = false;
  function deniedHtml() {
    pushWanted = true;
    var ua = navigator.userAgent, steps;
    if (Install.standalone() && !Install.isIOS()) {
      steps = ['홈 화면의 <b>성경통독</b> 아이콘을 <b>길게</b> 누르세요', '<b>앱 정보</b> (ⓘ) 를 누르세요', '<b>알림</b> → <b>켜기</b>'];
    } else if (/SamsungBrowser/.test(ua)) {
      steps = ['화면 아래 <b>≡</b> 메뉴 → <b>설정</b>', '<b>사이트 및 다운로드</b> → <b>알림</b>', '목록에서 <b>bing00179.github.io</b> 를 찾아 <b>허용</b>'];
    } else {
      steps = ['주소창 왼쪽 <b>아이콘</b> (자물쇠 또는 ⚙) 을 누르세요', '<b>권한</b> → <b>알림</b>', '<b>허용</b> 으로 바꾸세요'];
    }
    return '<div class="small miss" style="margin-bottom:8px">🔕 알림 비활성</div>' +
      '<div class="small">웹 앱은 설정 화면을 직접 열 수 없어서, 아래 순서로 한 번만 풀어 주세요.</div>' +
      '<ol class="steps">' + steps.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>' +
      '<div class="small" style="margin:-6px 0 12px">그래도 안 오면: 휴대폰 <b>설정 → 애플리케이션 → ' +
      (/SamsungBrowser/.test(ua) ? '삼성 인터넷' : 'Chrome') + ' → 알림</b> 도 켜져 있는지 봐 주세요. (메뉴 이름은 휴대폰마다 조금 달라요)</div>' +
      '<button class="big" data-act="setup-push">다시 확인</button>';
  }

  function alarmHtml() {
    var c = alarmChoice();
    if (c) {
      var what = c === 'cal' ? '📅 달력 알림 · 매일 ' + Core.hourLabel(myHour()) : c === 'push' ? '🔔 앱 알림 · 매일 ' + Core.hourLabel(myHour()) : '알림 안 받음';
      return '<div class="small" style="text-align:center;margin:-4px 0 12px">' + what +
        ' · <button class="linkbtn" data-act="alarm-change">바꾸기</button></div>';
    }
    var push = Push.status(), pushPart;
    if (!state.vapidKey) pushPart = '<div class="small">🔔 앱 알림은 회장님이 준비 중이에요.</div>';
    else if (push === 'ok' && Push.permission() === 'denied') pushPart = deniedHtml().replace('data-act="setup-push"', 'data-act="push-on"');
    else if (push === 'ok') pushPart = '<button class="big" data-act="push-on">🔔 앱 알림 받기</button>';
    else if (push === 'ios-home') pushPart = '<div class="small"><b>🔔 앱 알림 (아이폰)</b><br>' +
      '아래 가운데 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b> → 홈 화면의 <b>성경통독</b> 아이콘으로 열고 여기를 다시 눌러 주세요.</div>';
    else pushPart = '<div class="small">🔔 이 휴대폰(브라우저)에서는 앱 알림이 안 돼요. 달력 알림을 써 주세요.</div>';
    return '<div class="card"><div style="font-weight:700">매일 알림</div>' +
      '<div class="small" style="margin:4px 0 12px">원하는 분만, 원하는 시간에 받으시면 돼요.</div>' +
      hourPicker() + pushPart + calLink('📅 내 달력에 넣기') +
      '<div class="small" style="margin-top:6px">달력: 362일치 읽을 곳이 달력에 들어가요. 카톡 안에서 안 되면 ⋮ → 다른 브라우저로 열기.</div>' +
      '<div class="hint"><button class="linkbtn" data-act="alarm-none">알림 필요 없어요</button></div></div>';
  }

  // ── 말씀 읽기 (개역한글, 앱 안) ──
  var reading = null;      // 읽고 있는 날짜
  var readFrom = 'today';  // 돌아갈 탭
  var books = {};          // 권 번호 → {b, c} (한 번 받으면 기억)
  var loadErr = '';
  function fontSize() { try { return +localStorage.getItem('bible.font') || 20; } catch (e) { return 20; } }
  function setFont(n) { try { localStorage.setItem('bible.font', String(n)); } catch (e) {} }
  function loadBooks(list) {
    var need = [];
    list.forEach(function (c) { if (!books[c.book] && need.indexOf(c.book) < 0) need.push(c.book); });
    return Promise.all(need.map(function (n) {
      return fetch('text/' + (n < 10 ? '0' : '') + n + '.json').then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }).then(function (j) { books[n] = j; });
    }));
  }
  function verseBarHide() { var bar = document.getElementById('versebar'); if (bar) { bar.style.display = 'none'; bar.innerHTML = ''; } document.body.classList.remove('hasbar'); }
  function openReader(d, restoring, y) {
    Sel.clear(); memoOpen = false; verseBarHide();
    if (!restoring) { Tts.reset(); readFrom = tab; }
    reading = d; loadErr = '';
    render(); window.scrollTo(0, y || 0);
    loadBooks(Core.chaptersOf(P.portionFor(d))).catch(function () {
      loadErr = '말씀을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.';
    }).then(function () {
      if (reading !== d) return;
      render();
      if (focusKey) {
        var el = document.querySelector('.reader p[data-k="' + focusKey + '"]');
        if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); }
        focusKey = null;
      } else if (y) window.scrollTo(0, y);
    });
  }
  // ── 말씀 듣기 (휴대폰 한국어 음성, Web Speech) ──
  // 절마다 하나씩 읽음 (긴 글을 한 번에 넘기면 크롬이 중간에 끊는 일이 있어서). 장이 바뀌면 장 이름부터.
  var Tts = (function () {
    var ok = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
    var queue = [], pos = 0, playing = false, token = 0, cur = null, resume = null;
    function rate() { try { return +localStorage.getItem('bible.rate') || 1; } catch (e) { return 1; } }
    // 듣는 동안 화면이 절전으로 꺼지지 않게 (꺼지면 브라우저가 음성을 멈춤). 멈추면 놓아 줌.
    var lock = null;
    function holdScreen() {
      if (lock || !('wakeLock' in navigator)) return;
      navigator.wakeLock.request('screen').then(function (l) {
        lock = l; l.addEventListener('release', function () { lock = null; });
        if (!playing) releaseScreen();
      }).catch(function () {});
    }
    function releaseScreen() { if (lock) { try { lock.release(); } catch (e) {} lock = null; } }
    // 다른 앱에 갔다 오면 화면 붙잡기가 풀리므로 다시
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && playing) holdScreen(); });
    function voice() {
      var vs = ok ? speechSynthesis.getVoices() : [];
      return vs.filter(function (v) { return /^ko/i.test(v.lang); })[0] || null;
    }
    if (ok && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};
    function build() {
      queue = [];

    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function () {});
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(a.href); }, 2000);
    toast('📥 ' + name + ' 저장');

  function run(promise, after) {
    if (busy) return;
    busy = true;
    document.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    promise.then(function (s) { setState(s); if (after) after(s); })
      .catch(function (e) { toast(errMsg(e)); })
      .then(function () { busy = false; render(); });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || busy) return;
    if (b.dataset.tab) { tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (b.dataset.act === 'read') { openReader(b.dataset.date); return; }
    if (b.dataset.act === 'open-verse') { openVerse(b.dataset.k); return; }
    if (b.dataset.act === 'tts-play') { Tts.play(); return; }
    if (b.dataset.act === 'tts-rate') { Tts.setRate(+b.dataset.r); var bar = document.getElementById('ttsbar'); if (bar) bar.outerHTML = ttsBar(); return; }
    if (b.dataset.act === 'tts-pause') { Tts.pause(); return; }
    if (b.dataset.act === 'close-read') { Tts.reset(); Sel.clear(); memoOpen = false; verseBarHide(); reading = null; tab = readFrom; render(); window.scrollTo(0, 0); return; }
    if (b.dataset.act === 'font') {
      setFont(Math.max(14, Math.min(34, fontSize() + +b.dataset.n)));
      document.querySelectorAll('.reader .text, .fontsample').forEach(function (tx) { tx.style.fontSize = fontSize() + 'px'; });
      return;
    }
    var act = b.dataset.act;
    if (act === 'alarm-none') { setAlarm('none'); render(); return; }
    if (act === 'join') {
      run(call('join', me), function () { toast('✅ ' + openTerm().n + '기 참여'); });
      return;
    }
    if (act === 'push-toggle') {
      if (alarmChoice() === 'push') {
        run(Push.off().then(function (u) { return u ? call('unsubscribe', u) : Api.state(); }),
          function () { setAlarm('none'); toast('🔕 알림 꺼짐'); });
      } else {
        run(Push.on(state.vapidKey).then(function (u) { return call('subscribe', me, u, myHour()); }),
          function () { setAlarm('push'); toast('🔔 알림 켜짐 · 매일 ' + Core.hourLabel(myHour())); });
      }
      return;
    }
    if (act === 'reset-setup') {
      try { localStorage.removeItem('bible.setup'); localStorage.removeItem('bible.installed'); sessionStorage.removeItem('bible.installSkip2'); if (alarmChoice() !== 'push') localStorage.removeItem('bible.alarm'); } catch (e5) {}
      tab = 'today'; render(); window.scrollTo(0, 0); return;
    }
    if (act === 'alarm-change') {
      // 앱 알림을 받던 휴대폰이면 먼저 끔 (시트에 '해제' 줄)
      var was = alarmChoice(); setAlarm('');
      if (was === 'push') run(Push.off().then(function (u) { return u ? call('unsubscribe', u) : Api.state(); }));
      else render();
      return;
    }
    if (act === 'kakao-out') { Install.openExternal(); return; }
    if (act === 'chrome-out') { Install.openInChrome(); return; }
    if (act === 'stay-samsung') { try { sessionStorage.setItem('bible.staySamsung', '1'); } catch (e4) {} start(); return; }
    if (act === 'install') {
      Install.prompt().then(function (ok) { if (!ok) toast('설치 취소됨'); render(); });
      return;
    }
    if (act === 'not-installed') { try { localStorage.removeItem('bible.installed'); } catch (e6) {} render(); return; }
    if (act === 'installed') { try { localStorage.setItem('bible.installed', '1'); } catch (e2) {} render(); return; }
    if (act === 'install-skip') { skipInstall(); render(); return; }
    if (act === 'setup-none') { setAlarm('none'); finishSetup(); return; }
    if (act === 'setup-push') {
      run(Push.on(state.vapidKey).then(function (u) { return call('subscribe', me, u, myHour()); }),
        function () { setAlarm('push'); try { localStorage.setItem('bible.setup', 'done'); } catch (e3) {} tab = 'today'; toast('🔔 알림 켜짐 · 매일 ' + Core.hourLabel(myHour())); });
      return;
    }
    if (act === 'push-on') {
      run(Push.on(state.vapidKey).then(function (u) { return call('subscribe', me, u, myHour()); }),
        function () { setAlarm('push'); toast('🔔 알림 켜짐 · 매일 ' + Core.hourLabel(myHour())); });
      return;
    }
    if (act === 'switch') { Tts.reset(); me = null; reading = null; save(null); render(); }
    else if (act === 'pick') { me = b.dataset.name; save(me); tab = 'today'; render(); }

      });

    } else if (tab === 'set') render();
  });
  document.addEventListener('click', function (e) {
    // 절 누르기: 고르기/빼기
    var pEl = e.target.closest('.reader p[data-k]');
    if (pEl && !e.target.closest('button, a')) {
      Sel.toggle(pEl.dataset.k); memoOpen = false; refreshVerses([pEl.dataset.k]); verseBar(); return;
    }
    var b = e.target.closest('#versebar button'); if (!b) return;
    var ks = Sel.list(), act = b.dataset.act;
    if (!ks.length) return;
    if (act === 'v-clear') { Sel.clear(); memoOpen = false; refreshVerses(ks); verseBar(); }
    else if (act === 'v-hl') { Notes.setHl(ks, +b.dataset.c); Sel.clear(); refreshVerses(ks); verseBar(); toast(+b.dataset.c ? '🖍 형광펜' : '형광펜 지움'); }
    else if (act === 'v-bm') { var on = Notes.toggleBm(ks, selLabel(ks)); refreshVerses(ks); verseBar(); toast(on ? '🔖 책갈피 저장' : '책갈피 지움'); }
    else if (act === 'v-share') { shareVerses(ks); }
    else if (act === 'v-listen') {
      var first = document.querySelector('.reader p[data-k="' + ks[0] + '"]');
      var at = first ? { ci: +first.dataset.ci, vi: keyParts(ks[0]).v - 1 } : null;
      Sel.clear(); refreshVerses(ks); verseBar();
      Tts.resumeFrom(at); Tts.play();
    }
    else if (act === 'v-memo') { memoOpen = true; verseBar(); }
    else if (act === 'v-memo-close') { memoOpen = false; verseBar(); }
    else if (act === 'v-memo-delyr') {
      if (!confirm(b.dataset.y + '년 묵상을 지울까요? 되돌릴 수 없어요.')) return;
      Notes.delMemoYear(ks[0], b.dataset.y); refreshVerses(ks); verseBar(); toast(b.dataset.y + '년 묵상 지움');
    }
    else if (act === 'v-memo-save' || act === 'v-memo-del') {
      var t = act === 'v-memo-save' ? (document.getElementById('memotext').value || '').trim() : '';
      Notes.setMemo(ks[0], selLabel(ks), t);
      memoOpen = false; Sel.clear(); refreshVerses(ks); verseBar();
      toast(t ? '📝 묵상 저장' : '묵상 지움');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'newname') document.querySelector('[data-act=register]').click();
  });

  function kakaoHtml() {
    var where = Install.isAndroid() ? '크롬' : Install.isIOS() ? 'Safari' : '외부 브라우저';
    return '<div class="card"><div class="portion" style="font-size:24px;margin-top:0">' + where + '(으)로 이동</div>' +
      '<div class="small" style="margin-bottom:12px">카톡 안에서는 앱 설치와 알림이 안 돼요. 자동으로 안 넘어가면 아래를 눌러 주세요.</div>' +
      '<button class="big" data-act="kakao-out">' + where + '(으)로 열기</button>' +
      '<div class="small" style="margin-top:14px"><b>그래도 안 되면</b><br>' +
      (Install.isIOS() ? '오른쪽 아래 <b>공유 버튼</b> → <b>Safari로 열기</b>' : '오른쪽 위 <b>⋮</b> → <b>다른 브라우저로 열기</b>') + '</div></div>';
  }

  function samsungHtml() {
    return '<div class="card"><div class="portion" style="font-size:24px;margin-top:0">크롬으로 이동</div>' +
      '<div class="small" style="margin-bottom:12px">삼성 인터넷보다 크롬에서 앱 설치·알림이 잘 돼요. 자동으로 안 넘어가면 아래를 눌러 주세요.</div>' +
      '<button class="big" data-act="chrome-out">크롬으로 열기</button>' +
      '<div class="hint"><button class="linkbtn" data-act="stay-samsung">크롬이 없어요 · 여기서 계속</button></div></div>';
  }
  function staySamsung() { try { return sessionStorage.getItem('bible.staySamsung') === '1'; } catch (e) { return false; } }

  function start() {
    if (Install.isKakao()) {
      document.getElementById('main').innerHTML = kakaoHtml();
      Install.openExternal();
      return;
    }
    // 갤럭시 삼성 인터넷(설치한 앱 말고) → 크롬으로 한 번 넘김
    if (Install.isSamsung() && Install.isAndroid() && !Install.standalone() && !staySamsung()) {
      document.getElementById('main').innerHTML = samsungHtml();
      try { if (sessionStorage.getItem('bible.toChrome') !== '1') { sessionStorage.setItem('bible.toChrome', '1'); Install.openInChrome(); } } catch (e) { Install.openInChrome(); }
      return;
    }
    Install.onChange(function () { if (state && me && !setupDone()) render(); });
    if (!Api.ready) {
      document.getElementById('main').innerHTML = '<div class="card">단톡방에 올라온 <b>링크</b>를 눌러 들어와 주세요.<br>' +
        '<span class="small">(링크 끝에 우리 모임 주소가 붙어 있어야 열려요)</span></div>';
      return;
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register(Api.sw).catch(function () {});
    Api.state().then(function (s) {
      setState(s);
      var saved = load();
      me = saved && s.members.indexOf(saved) >= 0 ? saved : null;
      var v = me && loadView();
      if (v) {
        tab = v.tab || 'today';
        if (v.reading && P.portionFor(v.reading)) {
          readFrom = v.readFrom || 'today';
          Tts.resumeFrom(v.tts);
          openReader(v.reading, true, v.y);
          return;
        }
      }
      render();
      if (v && v.y) window.scrollTo(0, v.y);
    }).catch(function (e) {
      document.getElementById('main').innerHTML = '<div class="card">' + esc(errMsg(e)) +
        '<br><button class="big" style="margin-top:12px" onclick="location.reload()">다시 열기</button></div>';
    });
  }
  // 앱으로 돌아올 때마다(닫았다 열기·다른 앱에서 복귀) 최신 기록으로 새로고침
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !state || busy || !Api.ready) return;
    if (pushWanted && me && Push.permission() === 'granted' && alarmChoice() !== 'push') {
      // 설정에서 허용하고 돌아옴 → 바로 알림 켜기
      pushWanted = false;
      run(Push.on(state.vapidKey).then(function (u) { return call('subscribe', me, u, myHour()); }),
        function () { setAlarm('push'); try { localStorage.setItem('bible.setup', 'done'); } catch (e3) {} tab = 'today'; toast('🔔 알림 켜짐 · 매일 ' + Core.hourLabel(myHour())); });
      return;
    }
    Api.state().then(function (s) { setState(s); if (!busy) render(); }).catch(function () {});
  });
  start();
})();
</script>
</body>
</html>
