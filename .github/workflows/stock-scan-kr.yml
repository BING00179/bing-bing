# 국내장 종목 스캐너 — 깃허브 서버에서 자동 실행
#
# 내 PC 를 켜둘 필요가 없습니다. 깃허브가 대신 돌리고
#   · 텔레그램으로 알림을 보내고
#   · 웹페이지(stocks/)를 갱신해 저장소에 올립니다.
#
# ── 처음 한 번만 설정 ──
# Settings > Secrets and variables > Actions 에 등록:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# 웹페이지 주소는 Settings > Pages 에서 확인하세요.
# 보통 https://<사용자>.github.io/<저장소>/stocks/ 입니다.

name: 국내 종목 스캔

on:
  schedule:
    # 깃허브 예약은 UTC 기준입니다. UTC 시각 + 9 = 한국시간.
    # 실제 실행 여부는 파이썬이 한국시간을 직접 보고 판단하므로,
    # 장 시간 밖에 걸린 것은 한 줄 찍고 즉시 끝납니다.
    #
    # 장 시작 직후와 마감 직전을 촘촘하게 잡았습니다.
    # 갭은 09:00 동시호가로 정해지고, 그날의 진짜 방향은 마감 무렵에
    # 나옵니다. 중간 시간대는 상대적으로 덜 중요합니다.
    - cron: "*/10 0 * * 1-5"      # 한국시간 09:00~09:50, 10분마다 (장 시작)
    - cron: "*/30 1-4 * * 1-5"    # 한국시간 10:00~13:30, 30분마다 (중간)
    - cron: "*/10 5,6 * * 1-5"    # 한국시간 14:00~15:20, 10분마다 (장 마감)
  workflow_dispatch:
    inputs:
      force:
        description: "장 시간이 아니어도 강제 실행"
        type: boolean
        default: true

concurrency:
  group: stock-scan-kr
  cancel-in-progress: false

permissions:
  contents: write        # 웹페이지를 저장소에 올리기 위해 필요

jobs:
  scan:
    runs-on: ubuntu-latest
    # ⚠️ 2026-09-24 ~ 10-05 마감 실행이 전부 '취소' 였습니다. 장부 단계
    #    (livetest-record)가 1,825종목 시세를 종목당 약 1초로 새로 받느라
    #    29.4분을 쓰다가 30분 제한에 잘렸고, 그 뒤 '저장소에 올리기' 가
    #    건너뛰어져 장부가 한 건도 안 쌓였습니다. 러너는 매번 새로
    #    시작하므로 시세 저장고가 없습니다. 제한은 일에 맞춥니다.
    #    (tests/test_workflow.py 가 종목 수로 이 값을 검사합니다)
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-system/requirements.txt

      - name: 라이브러리 설치
        working-directory: trading-system
        run: pip install -r requirements.txt

      - name: 시장 상태 확인
        working-directory: trading-system
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.cli market --no-telegram

      - name: 스캐너 A — 시가갭
        continue-on-error: true   # 조회 실패로 웹페이지 갱신까지 막지 않습니다
        working-directory: trading-system
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.cli scan-kr-a ${{ inputs.force && '--force' || '' }} \
            || echo "::error::스캐너 A 가 실패했습니다"

      - name: 스캐너 B — 전략 조건 + 웹페이지 갱신
        continue-on-error: true   # 조회 실패로 웹페이지 갱신까지 막지 않습니다
        working-directory: trading-system
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.cli scan-kr-b --web ${{ inputs.force && '--force' || '' }} \
            || echo "::error::스캐너 B 가 실패했습니다 — 웹페이지가 안 갱신됩니다"

      # 장 마감 후 내일 볼 종목을 미리 추립니다.
      # 장중 스캐너가 "지금 살까"를 본다면, 이쪽은 "내일 뭘 볼까"입니다.
      - name: 내일 관찰 후보 추리기
        if: github.event_name == 'schedule'
        working-directory: trading-system
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HOUR=$(TZ=Asia/Seoul date +%H)
          MIN=$(TZ=Asia/Seoul date +%M)
          if [ "$HOUR" = "15" ] && [ "$MIN" -ge 20 ] && [ "$MIN" -le 40 ]; then
            python -m src.cli watchlist --no-telegram
          else
            echo "마감 시각이 아니므로 건너뜁니다. (현재 $HOUR:$MIN KST)"
          fi

      # 장 마감 무렵 한 번만 하루 요약을 보냅니다.
      # 신호가 뜰 때마다 오는 알림과 별개로, 오늘 전체를 한눈에 봅니다.
      - name: 마감 요약 보내기
        if: github.event_name == 'schedule'
        working-directory: trading-system
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HOUR=$(TZ=Asia/Seoul date +%H)
          MIN=$(TZ=Asia/Seoul date +%M)
          # 한국시간 15:20~15:40 사이의 실행에서만 보냅니다.
          if [ "$HOUR" = "15" ] && [ "$MIN" -ge 20 ] && [ "$MIN" -le 40 ]; then
            python -m src.cli daily-summary \
              --url "https://bing00179.github.io/bing-bing/stocks/"
          else
            echo "마감 시각이 아니므로 요약을 보내지 않습니다. (현재 $HOUR:$MIN KST)"
          fi

      # ── 실시간 검증 ──
      # 오늘 신호를 적어만 둡니다. 매수하지 않습니다.
      # 여기 쌓이는 것만이 '앞으로의 자료' 라, 조건을 고쳐서 맞출 수
      # 없는 유일한 증거입니다. 하루 한 번, 장 마감 뒤에만 돌립니다.
      - name: 실시간 검증 — 오늘 신호 적어 두기
        # ⚠️ working-directory 가 빠져 있어서 2026-09-01 부터 2026-09-14 까지
        #    매일 ModuleNotFoundError 로 죽었습니다. continue-on-error 가
        #    그 실패를 숨겨서 워크플로는 계속 '성공' 으로 찍혔고, 장부에는
        #    한 건도 안 쌓였습니다. 앞으로의 자료를 모으는 일이 2주 동안
        #    통째로 멈춰 있었던 것입니다.
        #
        #    그래서 두 가지를 고칩니다.
        #      ① working-directory 를 넣습니다 (진짜 원인)
        #      ② 실패하면 ::error:: 로 화면에 빨갛게 남깁니다.
        #         continue-on-error 는 그대로 둡니다 — 기록이 실패했다고
        #         웹페이지 갱신까지 막을 이유는 없습니다. 다만 조용히
        #         넘어가지는 않습니다.
        continue-on-error: true
        working-directory: trading-system
        run: |
          HOUR=$(TZ=Asia/Seoul date +%H)
          MIN=$(TZ=Asia/Seoul date +%M)
          # ⚠️ 2026-09-28 부터 깃허브가 예약 실행을 하루 3번쯤만 띄우고 시각도
          #    들쭉날쭉해서(10/1 15:45, 10/6 16:06, 10/7 15:47) 15:20~15:40 창에
          #    드는 날이 절반뿐이었습니다. 장부는 (날짜, 종목) 이 같으면 건너뛰므로
          #    두 번 돌아도 해가 없습니다. 그래서 창을 닫지 않습니다 — 15:20 이후
          #    그날 아무 실행에서나 적습니다. (tests/test_workflow.py 가 검사합니다)
          if [ "$HOUR" -gt 15 ] || { [ "$HOUR" = "15" ] && [ "$MIN" -ge 20 ]; }; then
            # 실패하면 **이유까지** 주석(annotation)에 남깁니다. 2026-09-15 15:26 실행에
            # "종목 목록을 못 만들었습니다" 만 남아 왜인지 알 수 없었습니다. 로그는
            # 로그인해야 보이지만 주석은 API 로도 보입니다.
            # data/universe_kosdaq.txt 는 저장소에 들어 있어(2026-09-15) 보통은
            # 목록을 새로 만들지 않습니다. 파일이 없을 때만 만듭니다.
            if [ ! -f data/universe_kosdaq.txt ]; then
              if ! python -m src.cli kr-universe --market KOSDAQ \
                   --out data/universe_kosdaq.txt > /tmp/universe.log 2>&1; then
                echo "::error::종목 목록을 못 만들었습니다 — $(tail -n 3 /tmp/universe.log | tr '\n' ' ')"
              fi
            fi
            if ! python -m src.cli livetest-record \
                 --universe data/universe_kosdaq.txt > /tmp/record.log 2>&1; then
              echo "::error::장부 기록에 실패했습니다 — 앞으로의 자료가 안 쌓입니다 — $(tail -n 3 /tmp/record.log | tr '\n' ' ')"
            fi
            cat /tmp/record.log 2>/dev/null || true
            if [ -f data/livetest.csv ]; then
              echo "장부 줄 수: $(( $(wc -l < data/livetest.csv) - 1 ))건"
            else
              echo "::error::장부 파일이 안 만들어졌습니다"
            fi
          else
            echo "마감 시각이 아니므로 기록하지 않습니다. (현재 $HOUR:$MIN KST)"
          fi

      # ── 월말 ──
      # 이 달 마지막 평일, 15:20 이후 그날 아무 실행에서나. 표시 파일로 한 달에 한 번만.
      # ⚠️ 2026-10-08: value-record 는 DART 재무 파일이 있어야 하는데 러너에는 없어
      #    "재무 파일이 없습니다" 로 끝날 상태였습니다(다섯 번째 벽). value-fetch 를
      #    먼저 돌립니다(20~40분, DART_API_KEY 필요). 말일이 주말인 달(2026-10 은
      #    토요일, 2027-01 은 일요일)을 위해 "내일이 1일" 대신 month-end-check 로
      #    마지막 평일을 셉니다.
      - name: 월말 — 재무 받기 · 후보 기록 · 브리핑
        continue-on-error: true
        working-directory: trading-system
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HOUR=$(TZ=Asia/Seoul date +%H)
          MIN=$(TZ=Asia/Seoul date +%M)
          MONTH=$(TZ=Asia/Seoul date +%Y-%m)
          DONE="data/monthly_review_${MONTH}.done"
          if ! { [ "$HOUR" -gt 15 ] || { [ "$HOUR" = "15" ] && [ "$MIN" -ge 20 ]; }; }; then
            echo "마감 전입니다. (현재 $HOUR:$MIN KST)"; exit 0
          fi
          if ! python -m src.cli month-end-check; then exit 0; fi
          if [ -f "$DONE" ]; then echo "이 달 월말 단계는 이미 끝났습니다: $DONE"; exit 0; fi
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::DART_API_KEY 가 없습니다 — Settings > Secrets > Actions 에 넣어야 월말 후보를 뽑습니다"; exit 0
          fi
          python -m src.cli value-fetch --market KOSDAQ \
            || { echo "::error::재무 받기에 실패했습니다"; exit 0; }
          python -m src.cli value-record --market KOSDAQ --top 10 \
              --candidates-out data/value_candidates.csv \
            || echo "::error::저평가 후보 기록에 실패했습니다"
          python -m src.cli monthly-review --days 120 --telegram \
            || echo "::error::월말 브리핑에 실패했습니다"
          echo "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" > "$DONE"

      - name: 웹페이지와 기록 저장소에 올리기
        run: |
          if [ -z "$(git status --porcelain stocks/ trading-system/data/livetest.csv trading-system/data/value_candidates.csv trading-system/data/monthly_review_*.done)" ]; then
            echo "바뀐 내용이 없어 올리지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/          # index.html · history.json · notified.json
          git add trading-system/data/livetest.csv || true   # 실시간 검증 기록
          git add trading-system/data/value_candidates.csv || true   # 월말 후보 전체
          git add trading-system/data/monthly_review_*.done || true  # 월말 한 번만 표시
          git commit -m "스캔 결과 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          # 다른 커밋이 먼저 올라갔을 수 있으므로 한 번 당겨서 합칩니다.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-scan-${{ github.run_id }}
          path: trading-system/output/
          retention-days: 30
          if-no-files-found: ignore
