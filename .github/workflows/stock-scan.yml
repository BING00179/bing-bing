# 종목 자동 분석 스캐너 — 깃허브 서버에서 자동 실행
#
# 내 PC 를 켜둘 필요가 없습니다. 깃허브가 대신 돌리고 결과를 텔레그램으로 보냅니다.
#
# ── 처음 한 번만 설정 ──
# 저장소 > Settings > Secrets and variables > Actions > New repository secret
#   TELEGRAM_BOT_TOKEN   @BotFather 에게 /newbot 으로 받은 토큰
#   TELEGRAM_CHAT_ID     알림 받을 채팅 ID
# (선택) BENZINGA_API_KEY  없으면 무료 헤드라인을 씁니다
#
# ⚠️ 토큰을 코드나 이 파일에 직접 적지 마세요. 반드시 Secrets 에 넣습니다.

name: 종목 스캔

on:
  # ⚠️ 자동 실행을 꺼두었습니다. 국내장만 쓰신다면 그대로 두세요.
  #    미국장 알림을 받고 싶으면 아래 schedule 의 주석(#)을 지우면 됩니다.
  #    Actions 탭에서 손으로 실행하는 것은 지금도 됩니다.
  # schedule:
    # 깃허브의 예약 시간은 UTC 기준입니다. 미국 서머타임에 따라 ET 와의
    # 차이가 바뀌므로, 두 경우를 모두 덮는 넓은 구간을 잡아두고
    # 실제 실행 여부는 파이썬이 ET 를 직접 보고 판단합니다.
    #   ET 08:30~15:05  =  서머타임 UTC 12:30~19:05 / 겨울 UTC 13:30~20:05
    #   - cron: "*/30 12-20 * * 1-5"
  # Actions 탭에서 손으로 즉시 실행할 때
  workflow_dispatch:
    inputs:
      force:
        description: "실행 시간대(평일 미국 장중)를 무시하고 강제 실행"
        type: boolean
        default: true

# 앞 실행이 아직 안 끝났으면 새로 시작하지 않습니다(중복 알림 방지).
concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: trading-system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading-system/requirements.txt

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      # 손으로 실행할 때만. 텔레그램 토큰·채팅 ID 가 제대로 등록됐는지
      # 스캔 결과와 무관하게 바로 확인합니다.
      - name: 텔레그램 연결 확인
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.cli test-telegram

      - name: 스캐너 A — 프리마켓 갭
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}
        run: python -m src.cli scan-a ${{ inputs.force && '--force' || '' }}

      # 같은 실행 안에서 이어지므로 스캐너 B 가 A 의 결과 파일을 그대로 씁니다.
      - name: 스캐너 B — 전략 조건 필터링
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.cli scan-b ${{ inputs.force && '--force' || '' }}

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: trading-system/output/
          retention-days: 30
          if-no-files-found: ignore
